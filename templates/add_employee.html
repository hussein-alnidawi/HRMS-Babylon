{% extends "base.html" %}

{% block title %}Add Employee - HRMS-Babylon{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Add New Employee</h1>
    <a href="{{ url_for('employees') }}" class="btn btn-outline">← Back to Employees</a>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('add_employee') }}" class="form">
        <div class="form-row">
            <div class="form-group">
                <label for="first_name">First Name *</label>
                <input type="text" id="first_name" name="first_name" class="form-control" required placeholder="Enter first name">
            </div>

            <div class="form-group">
                <label for="last_name">Last Name *</label>
                <input type="text" id="last_name" name="last_name" class="form-control" required placeholder="Enter last name">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" class="form-control" required placeholder="employee@example.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" class="form-control" placeholder="+123456789">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="department_id">Department</label>
                <select id="department_id" name="department_id" class="form-control">
                    <option value="">Select Department</option>
                    {% for dept in departments %}
                    <option value="{{ dept.id }}">{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="position">Position</label>
                <input type="text" id="position" name="position" class="form-control" placeholder="Enter position">
            </div>
        </div>

        <div class="form-group">
            <label for="hire_date">Hire Date *</label>
            <input type="date" id="hire_date" name="hire_date" class="form-control" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Employee</button>
            <a href="{{ url_for('employees') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
