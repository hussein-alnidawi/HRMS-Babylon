{% extends "base.html" %}

{% block title %}Add Department - HRMS-Babylon{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Add New Department</h1>
    <a href="{{ url_for('departments') }}" class="btn btn-outline">← Back to Departments</a>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('add_department') }}" class="form">
        <div class="form-group">
            <label for="name">Department Name *</label>
            <input type="text" id="name" name="name" class="form-control" required placeholder="Enter department name">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" class="form-control" rows="4" placeholder="Enter department description"></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add Department</button>
            <a href="{{ url_for('departments') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
